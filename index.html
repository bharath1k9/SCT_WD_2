<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos — Stopwatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="wrap">
    <p class="eyebrow">Stopwatch</p>

    <div class="dial" id="dial">
      <svg class="dial-ring" viewBox="0 0 200 200">
        <circle class="dial-track" cx="100" cy="100" r="92" />
        <circle class="dial-progress" id="dialProgress" cx="100" cy="100" r="92" />
      </svg>
      <div class="dial-face">
        <div class="time" id="timeDisplay">00:00.00</div>
        <div class="status" id="statusLabel">Ready</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="lapBtn" disabled>Lap</button>
      <button class="btn btn-primary" id="startPauseBtn">Start</button>
      <button class="btn btn-secondary" id="resetBtn" disabled>Reset</button>
    </div>

    <div class="laps-container">
      <div class="laps-header">
        <span>Laps</span>
        <span id="lapCount">0</span>
      </div>
      <ul class="laps-list" id="lapsList">
        <li class="laps-empty" id="lapsEmpty">No laps recorded yet</li>
      </ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
